name: Cloud market surveillance

on:
  workflow_dispatch:
  schedule:
    - cron: '2/5 * * * 1-5'

permissions:
  contents: read

concurrency:
  group: public-market-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch market data and screen candidate anomalies
        run: python public_market_collector.py --output-dir output
      - name: Compile independently checkable run ledger and HTML report
        if: success()
        run: |
          python batch_to_ledger.py --input output/bars.csv --database output/firewall.db
          python render_cloud_report.py
      - name: Upload research snapshot and run status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firewall-market-snapshot-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: warn
