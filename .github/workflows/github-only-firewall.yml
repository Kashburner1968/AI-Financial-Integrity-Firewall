name: GitHub-only firewall cloud and public dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '3/5 * * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-only-firewall
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public bars
        run: python public_market_collector.py --output-dir output
      - name: Publish bounded snapshot
        run: python publish_github_data.py
      - name: Commit snapshot to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/latest.json site/archive/
          if ! git diff --cached --quiet; then
            git commit -m "Cloud market snapshot [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
  pages:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy public dashboard
        id: deployment
        uses: actions/deploy-pages@v4
